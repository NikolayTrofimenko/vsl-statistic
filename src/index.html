<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Euphoria / analytics</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Apply the saved theme before first paint to avoid a flash of light UI.
    (function () {
      try {
        var m = localStorage.getItem('vslstat.theme') || 'dark';
        var dark = m === 'dark' ||
          (m === 'system' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>

@if (api.authenticated() === null) {
  <div class="app-booting"></div>
} @else if (!api.authenticated()) {
  <app-login />
} @else {
  <mat-sidenav-container class="app-shell">
    <mat-sidenav mode="side" opened class="app-sidenav">
      <div class="brand">
        <app-monogram class="brand-mark" [size]="26" />
        <div class="brand-text">
          <span class="brand-parent">Euphoria</span>
          <span class="brand-sep">/</span>
          <span class="brand-product">analytics</span>
        </div>
      </div>
      <mat-nav-list>
        @for (item of nav(); track item.path) {
          <a mat-list-item [routerLink]="item.path" routerLinkActive="active">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>

      <div class="sidenav-footer">
        <button
          mat-button
          class="logout-button"
          (click)="theme.toggle()"
          [matTooltip]="theme.isDark() ? 'Светлая тема' : 'Тёмная тема'"
        >
          <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
          <span>Тема</span>
        </button>
        @if (api.user(); as user) {
          <div class="who" [matTooltip]="roleLabel()">
            <mat-icon>person</mat-icon>
            <span class="who-login">{{ user.login }}</span>
            <span class="who-role">{{ roleLabel() }}</span>
          </div>
        }
        <button mat-button class="logout-button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Выйти</span>
        </button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="app-content">
      <main class="app-main">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
